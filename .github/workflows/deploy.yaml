name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: ${{secrets.SAUSAGE_STORE_NAMESPACE}}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  # Сборка и пуш образов в докерхаб:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          # Получение исходного кода из репозитория:
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          # Установка сборщика контейнеров Docker:
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker 
          # Авторизация на Docker Hub:
          uses: docker/login-action@v2
          # При помощи with передаём в action параметры username и password:
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            # Хорошо ли держать логин и пароль прямо в коде workflow?
            # Нет, это нехорошо. Хранить пароль надо в Secrets.
        - name: Push Backend to DockerHub
          # Одновременный билд и пуш образа в Docker Hub:
          uses: docker/build-push-action@v4
          with:
            # Параметр context: ./backend/ указывает, что нужный Dockerfile 
            # находится в ./backend/
            context: ./backend/
            # Параметр push: true указывает, что образ нужно не только собрать,
            # но и отправить на Docker Hub:
            push: true
            # В параметре tags задаётся название и тег для образа.
            # Для каждого пересобранного образа 
            # устанавливаем тег latest, чтобы потом
            # на сервере и в docker-compose.yml не указывать версию образа:
            tags: steplet/sausage-backend:latest
            build-args: |
              VERSION=${{ github.sha }}
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: steplet/sausage-frontend:latest
        - name: Push Backend-report to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend-report/
            push: true
            tags: steplet/sausage-backend-report:latest
  # Упаковываем helm-чарт и пушим его в Nexus
  add_helm_chart_to_nexus:
      name: Add Helm Chart To Nexus
      runs-on: ubuntu-latest
      needs: build_and_push_to_docker_hub

      steps:
        - name: Check out the repo
          uses: actions/checkout@v3

        - name: Install Helm
          uses: azure/setup-helm@v4

        - name: Lint Helm chart
          run: |
            helm lint ./sausage-store-chart

        - name: Package Helm chart
          run: |
            helm package ./sausage-store-chart
            ls -la ./*.tgz

        - name: Upload Helm chart to Nexus
          env:
            NEXUS_HELM_REPO: ${{ env.NEXUS_HELM_REPO }}
            NEXUS_HELM_REPO_USER: ${{ env.NEXUS_HELM_REPO_USER }}
            NEXUS_HELM_REPO_PASSWORD: ${{ env.NEXUS_HELM_REPO_PASSWORD }}
          run: |
            set -euo pipefail

            PKG="$(ls -1 sausage-store-*.tgz | head -n 1)"
            echo "Uploading ${PKG} to ${NEXUS_HELM_REPO}/"

            curl --fail --show-error --silent \
              -u "${NEXUS_HELM_REPO_USER}:${NEXUS_HELM_REPO_PASSWORD}" \
              --upload-file "${PKG}" \
              "${NEXUS_HELM_REPO}/${PKG}"

  # Деплоим приложения в кластер Kubernetes с помощью helm-чарт
  deploy_helm_chart_to_kubernetes:
      name: Deploy Helm Chart To Kubernetes
      runs-on: ubuntu-latest
      needs: add_helm_chart_to_nexus

      steps:
        - name: Check out the repo
          uses: actions/checkout@v3

        - name: Install kubectl
          uses: azure/setup-kubectl@v4

        - name: Install Helm
          uses: azure/setup-helm@v4

        - name: Configure kubeconfig
          env:
            KUBE_CONFIG: ${{ env.KUBE_CONFIG }}
          run: |
            set -euo pipefail

            mkdir -p "${HOME}/.kube"
            # If secret contains plain YAML, write it as-is.
            if echo "${KUBE_CONFIG}" | head -n 1 | grep -q '^apiVersion:'; then
              printf '%s\n' "${KUBE_CONFIG}" > "${HOME}/.kube/config"
            else
              # Otherwise assume base64 and decode.
              echo "${KUBE_CONFIG}" | base64 -d > "${HOME}/.kube/config"
            fi

            chmod 600 "${HOME}/.kube/config"
            kubectl config current-context

        - name: Add Nexus Helm repo
          run: |
            helm repo add nexus "${NEXUS_HELM_REPO}" \
              --username "${NEXUS_HELM_REPO_USER}" \
              --password "${NEXUS_HELM_REPO_PASSWORD}"
            helm repo update

        - name: Deploy Helm chart to Kubernetes
          run: |
            set -euo pipefail

            helm upgrade --install sausage-store nexus/sausage-store \
              --namespace "${SAUSAGE_STORE_NAMESPACE}" \
              --create-namespace \
              --wait \
              --timeout 10m